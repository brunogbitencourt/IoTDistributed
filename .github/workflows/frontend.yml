name: Frontend CI
on:
  push:
    paths:
      - 'frontend/iotdistributed-web/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/iotdistributed-web/**'
      - '.github/workflows/frontend.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/iotdistributed-web/package-lock.json
      - name: Install and build
        working-directory: frontend/iotdistributed-web
        run: |
          npm ci
          npm run build
          npm run lint
