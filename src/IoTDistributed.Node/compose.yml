
services:
  node-1:
    image: iotdistributed-node:dev
    environment:
      NODE_ID: "1"
      GRPC_PORT: "8080"
      PEERS: "2=http://node-2:8080;3=http://node-3:8080"
    ports:
      - "127.0.0.1:5001:8080"

  node-2:
    image: iotdistributed-node:dev
    environment:
      NODE_ID: "2"
      GRPC_PORT: "8080"
      PEERS: "1=http://node-1:8080;3=http://node-3:8080"
    ports:
      - "127.0.0.1:5002:8080"

  node-3:
    image: iotdistributed-node:dev
    environment:
      NODE_ID: "3"
      GRPC_PORT: "8080"
      PEERS: "1=http://node-1:8080;2=http://node-2:8080"
    ports:
      - "127.0.0.1:5003:8080"
