
services:
  node-1:
    image: iotdistributed-node:dev
    environment:
      NODE_ID: "1"
      GRPC_PORT: "8080"
      PEERS: "2=http://node-2:8080;3=http://node-3:8080"
      ConnectionStrings__Default: "Host=db1;Port=5432;Database=iotdb;Username=iot;Password=admin"
    ports:
      - "127.0.0.1:5001:8080"
    depends_on:
      db1:
        condition: service_healthy

  node-2:
    image: iotdistributed-node:dev
    environment:
      NODE_ID: "2"
      GRPC_PORT: "8080"
      PEERS: "1=http://node-1:8080;3=http://node-3:8080"
      ConnectionStrings__Default: "Host=db2;Port=5432;Database=iotdb;Username=iot;Password=admin"
    ports:
      - "127.0.0.1:5002:8080"
    depends_on:
      db2:
        condition: service_healthy

  node-3:
    image: iotdistributed-node:dev
    environment:
      NODE_ID: "3"
      GRPC_PORT: "8080"
      PEERS: "1=http://node-1:8080;2=http://node-2:8080"
      ConnectionStrings__Default: "Host=db3;Port=5432;Database=iotdb;Username=iot;Password=admin"
    ports:
      - "127.0.0.1:5003:8080"
    depends_on:
      db3:
        condition: service_healthy

  db1:
    image: postgres:17
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: iotdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iotdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  db2:
    image: postgres:17
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: iotdb
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iotdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  db3:
    image: postgres:17
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: iotdb
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pg3_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iotdb"]
      interval: 5s
      timeout: 3s
      retries: 10


  
  
  db-init:
    image: postgres:17
    environment:
      PGPASSWORD: admin
    volumes:
      - ../../database:/scripts:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for host in db1 db2 db3; do
          echo "Inicializando banco $$host"

          psql -h "$$host" -U iot -d iotdb \
            -v ON_ERROR_STOP=1 \
            -f /scripts/001_initial_schema.sql
        done

    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy
      db3:
        condition: service_healthy



volumes:
  pg1_data:
  pg2_data:
  pg3_data:
