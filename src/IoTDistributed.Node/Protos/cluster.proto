
syntax = "proto3";

option csharp_namespace = "IoTDistributed.Node.Grpc";

package cluster;

service Cluster {
    rpc Ping (PingRequest) returns (PingReply);

    rpc SubmitReading (SensorReadingRequest)
      returns (SensorReadingReply);

    rpc ReplicateReading (ReplicateReadingRequest)
       returns (ReplicateReadingReply);    
}

message PingRequest {
    int32 senderId = 1;
}

message PingReply {
    int32 responderId = 1;
    bool success = 2;
}


message SensorReadingRequest {
  string event_id = 1;
  string sensor_id = 2;
  double value = 3;
  int64 collected_at_unix_ms = 4;
}

message SensorReadingReply {
  string event_id = 1;
  bool inserted = 2;
  int32 node_id = 3;
}


message ReplicateReadingRequest {
  string event_id = 1;
  string sensor_id = 2;
  double value = 3;
  int64 collected_at_unix_ms = 4;
  int32 origin_node_id = 5;
}

message ReplicateReadingReply {
  string event_id = 1;
  bool inserted = 2;
  int32 node_id = 3;
}
