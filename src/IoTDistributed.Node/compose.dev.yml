# Opcional: Vite com hot reload no Docker, sem instalar Node.js no Windows.
# Uso (na pasta deste arquivo):
# docker compose -f compose.yml -f compose.dev.yml up -d --build frontend-dev
# Acesse http://localhost:5174 (a apresentação padrão permanece na porta 5173).
services:
  frontend-dev:
    image: iotdistributed-web:dev
    build:
      context: ../../frontend/iotdistributed-web
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5174:5173"
    volumes:
      - ../../frontend/iotdistributed-web:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
